[FilterPlugin]
; Add non-standard files here when packaging the plugin.

; The compiled script bundle. A .js file is not an asset, so the cooker's reference graph
; never sees it and staging would leave it behind -- and a package missing its scripts does
; not look broken: every scripted rule falls back to its C++ default and the game plays on
; with the wrong numbers. This line is what puts it in the build.
/Content/Script/main.js
